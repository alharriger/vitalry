<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-app); padding: 24px; color: var(--text-primary); }
  .sec { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: var(--ls-caps); color: var(--text-muted); margin: 0 0 10px; }
  .stack { max-width: 380px; display: flex; flex-direction: column; gap: 22px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { SegmentedControl, TextField } = window.VitalryDesignSystem_cc3bad;
function Demo() {
  const [days, setDays] = React.useState('14');
  const [name, setName] = React.useState('Harriger Family');
  const [prize, setPrize] = React.useState('');
  return (
    <div className="stack">
      <div>
        <div className="sec">Competition length</div>
        <SegmentedControl value={days} onChange={setDays} options={[
          { value:'7', label:'7', sublabel:'days' },
          { value:'14', label:'14', sublabel:'days' },
          { value:'30', label:'30', sublabel:'days' },
        ]} />
      </div>
      <div>
        <div className="sec">Text fields</div>
        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          <TextField label="Group name" icon="ph-bold ph-users-three" value={name} onChange={setName} />
          <TextField label="Prize (optional)" icon="ph-bold ph-trophy" placeholder="Loser hosts Thanksgiving"
            value={prize} onChange={setPrize} helper="Shown to everyone on the competition screen" />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
