<!-- @dsCard group="Components" viewport="700x540" name="Core — Buttons, Cards, Badges, Avatars" subtitle="Foundational primitives" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-app); padding: 22px; color: var(--text-primary); }
  .sec { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: var(--ls-caps); color: var(--text-muted); margin: 20px 0 10px; }
  .sec:first-child { margin-top: 0; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Button, Card, Badge, Avatar, ProgressRing } = window.VitalryDesignSystem_cc3bad;
function Demo() {
  return (
    <div>
      <div className="sec">Buttons</div>
      <div className="row">
        <Button variant="primary" icon="ph-bold ph-check">Log today</Button>
        <Button variant="secondary">Skip</Button>
        <Button variant="ghost">Cancel</Button>
        <Button variant="gold" icon="ph-fill ph-trophy">Run it back</Button>
        <Button variant="primary" disabled>Disabled</Button>
      </div>
      <div className="row" style={{marginTop:12}}>
        <Button size="sm" variant="secondary">Small</Button>
        <Button size="md" variant="secondary">Medium</Button>
        <Button size="lg" variant="secondary">Large</Button>
      </div>

      <div className="sec">Cards</div>
      <div className="grid2">
        <Card>Standard card — hairline border, soft shadow.</Card>
        <Card variant="tint">Tint card — quiet grouped info.</Card>
        <Card variant="feature">Feature card — biggest radius &amp; lift.</Card>
        <Card accentColor="var(--goal-water)">Accent card — color-coded by category.</Card>
      </div>

      <div className="sec">Badges</div>
      <div className="row">
        <Badge variant="tint" color="var(--goal-water)" icon="ph-fill ph-drop">6 / 8</Badge>
        <Badge variant="solid" color="var(--flame-500)" icon="ph-fill ph-fire">12</Badge>
        <Badge variant="outline" dot color="var(--green-500)">Active day</Badge>
        <Badge variant="tint" color="var(--sun-400)" icon="ph-fill ph-star">Perfect</Badge>
        <Badge variant="neutral">4 days left</Badge>
      </div>

      <div className="sec">Avatars &amp; Progress</div>
      <div className="row">
        <Avatar name="Amber Harriger" size="sm" />
        <Avatar name="Mom" size="md" />
        <Avatar name="Dad" size="lg" />
        <Avatar name="Jo" size="xl" ring />
        <div style={{width:20}} />
        <ProgressRing value={6} max={9} size={72} thickness={9} color="var(--green-500)">
          <span style={{fontFamily:'var(--font-display)',fontWeight:800,fontSize:22}}>6</span>
        </ProgressRing>
        <ProgressRing value={92} max={100} size={72} thickness={9} color="var(--goal-air)">
          <span style={{fontFamily:'var(--font-display)',fontWeight:800,fontSize:18}}>92%</span>
        </ProgressRing>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
